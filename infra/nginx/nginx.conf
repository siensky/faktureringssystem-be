# Enda publika ingången till systemet (planens "Ingång: nginx som enda
# publika ingång"). Routar till de fyra tjänsterna över det interna Docker-
# nätverket — ingen av dem exponerar sin port direkt mot omvärlden i
# produktionsläge (docker-compose.yml exponerar dem lokalt bara för att
# göra utveckling bekvämt; se kommentaren där).
#
# Två saker nginx äger som tjänsterna INTE ska göra själva:
#   1. Grov rate limiting per IP (den finkorniga, per-konto, sitter i
#      Fastify/Redis — se packages/shared/src/redis).
#   2. Att /internal/* ALDRIG når utifrån. Det är S2S-endpoints som bara
#      får anropas tjänst-till-tjänst; M2M-auth är andra försvarslinjen,
#      inte den enda (planens "Säkerhet: Transportnära grunder").

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Grov, per-IP rate limiting. "grov" är avsiktligt löst — den finkorniga,
  # per-konto-strypningen på t.ex. /auth/login byggs i Fastify i fas 1.
  limit_req_zone $binary_remote_addr zone=coarse_per_ip:10m rate=20r/s;
  limit_req_status 429;

  # Matchar Fastifys bodyLimit (256 KB) som standard. Endpoints som
  # faktiskt behöver mer (payments filimport, fas 5) får ett eget
  # location-block med högre gräns när den byggs — inte en global höjning.
  client_max_body_size 256k;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  upstream auth_service {
    server auth:4001;
  }

  upstream billing_service {
    server billing:4002;
  }

  upstream payments_service {
    server payments:4003;
  }

  upstream documents_service {
    server documents:4004;
  }

  server {
    listen 80;

    limit_req zone=coarse_per_ip burst=40 nodelay;

    # /internal/* är S2S-endpoints (t.ex. GET /internal/invoices/:id/snapshot
    # i fas 3) och ska ALDRIG nås utifrån — bara tjänst-till-tjänst över det
    # interna Docker-nätverket, som går direkt till varje tjänsts port och
    # aldrig via nginx. Explicit deny här, inte bara "inget location-block",
    # så ett framtida location-block med fel prefix inte råkar exponera det.
    location /internal/ {
      return 404;
    }

    location /auth/ {
      proxy_pass http://auth_service;
    }

    location /admin/ {
      proxy_pass http://billing_service;
    }

    # Mer specifik än /admin/ ovan — nginx väljer alltid det längsta
    # matchande prefixet bland vanliga (icke-regex) location-block, så den
    # här träffar payments (den manuella matchningskön, fas 5) i stället
    # för billing utan att röra ordningen på blocken.
    location /admin/payments/ {
      proxy_pass http://payments_service;
    }

    location /portal/ {
      proxy_pass http://billing_service;
    }

    location /webhooks/payment {
      proxy_pass http://payments_service;
    }

    location /webhooks/email-status {
      proxy_pass http://documents_service;
    }

    location /webhooks/stripe {
      proxy_pass http://payments_service;
    }

    # nginx egen liveness — inte samma sak som tjänsternas /health/*.
    location = /health {
      return 200 '{"status":"ok"}';
      add_header Content-Type application/json;
    }

    location / {
      return 404;
    }
  }
}
