[project]
name = "documents"
version = "0.1.0"
description = "PDF- och e-postutskick. Se PLAN.md fas 4/5 för affärslogiken; fas 0 är bara fundamentet."
readme = "README.md"
authors = [
    { name = "siennalansky", email = "siennalansky@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "aio-pika>=9.5.0",
    "jsonschema>=4.23.0",
    "structlog>=24.4.0",
    "redis>=5.2.0",
    "asyncpg>=0.30.0",
    "boto3>=1.35.0",
    "pyjwt>=2.9.0",
    "weasyprint>=63.0",
    "jinja2>=3.1.4",
    "aiosmtplib>=3.0.2",
    "httpx>=0.27.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI-idiomet: en dependency deklareras som Depends(...) i ett
# parameter-default. Det är inte den muterbara-default-fällan B008 finns
# för.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
