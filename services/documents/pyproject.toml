[project]
name = "documents"
version = "0.1.0"
description = "PDF- och e-postutskick. Se PLAN.md fas 4/5 för affärslogiken; fas 0 är bara fundamentet."
readme = "README.md"
authors = [
    { name = "siennalansky", email = "siennalansky@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "aio-pika>=9.5.0",
    "jsonschema>=4.23.0",
    "structlog>=24.4.0",
    "redis>=5.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "httpx>=0.27.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
